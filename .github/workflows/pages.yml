name: Deploy XLock to GitHub Pages

# GitHub Pages is still configured with its legacy branch/Jekyll publisher.
# That job publishes raw Vite source and can cause a white screen.
# This workflow intentionally deploys the compiled Vite artifact AFTER a delay,
# so the compiled app is the final Pages deployment on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xlock-compiled-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Let legacy Pages publisher finish first
        run: sleep 45

      - name: Deploy compiled XLock
        id: deployment
        uses: actions/deploy-pages@v4
